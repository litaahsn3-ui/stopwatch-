<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stopwatch">
      <h1 class="title">Stopwatch</h1>
      <p id="display" class="display" role="timer" aria-live="off">00:00:00.00</p>
      <div class="controls">
        <button id="startButton" type="button">Mulai</button>
        <button id="pauseButton" type="button" disabled>Jeda</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
